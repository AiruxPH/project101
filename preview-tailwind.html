<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Preview v2 (Tailwind)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/loader.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts - Material Design Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* Material Design 3 Shell Adjustments for App Context */
        body {
            height: 100vh !important;
            min-height: 100vh !important;
            overflow: hidden !important;
        }

        header {
            padding: 0.75rem 2rem !important;
            /* Slimmer header for app view */
        }

        nav {
            padding: 0.5rem 2rem !important;
            /* Slimmer nav for app view */
        }

        footer {
            padding: 0.75rem 2rem !important;
            /* Slimmer footer for app view */
            background: #FFFBFE !important;
        }

        /* Compatibility Styles for script.js */
        @keyframes rainbow {
            0% {
                background-color: #ffadad;
                color: #000;
            }

            14% {
                background-color: #ffd6a5;
            }

            28% {
                background-color: #fdffb6;
            }

            42% {
                background-color: #caffbf;
            }

            57% {
                background-color: #9bf6ff;
            }

            71% {
                background-color: #a0c4ff;
            }

            85% {
                background-color: #bdb2ff;
            }

            100% {
                background-color: #ffadad;
                color: #000;
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25%,
            75% {
                transform: translateX(-5px) rotate(-5deg);
            }

            50% {
                transform: translateX(5px) rotate(5deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
            }

            50% {
                box-shadow: 0 0 20px rgba(52, 152, 219, 0.9), 0 0 10px rgba(52, 152, 219, 0.5);
            }
        }

        /* Interaction Items (Generated by JS) */
        .interaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            font-size: 0.85rem;
            color: #4a5568;
        }

        .interaction-item .remove-btn {
            background: none;
            border: none;
            color: #e53e3e;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 0 4px;
        }

        .interaction-item .remove-btn:hover {
            color: #c53030;
        }

        /* Modal Styles (Custom overrides for VS Code theme if needed, or just let Tailwind handle it?)
    The Modal HTML is in the file, so we can convert it to Tailwind too.
    BUT script.js toggles 'display: block' on #codeModal.
    We need to ensure it's hidden by default.
    */
        #codeModal {
            display: none;
        }

        /* Dark Mode for Preview Panel (Handled by JS toggling .dark-mode class) */
        .preview-panel.dark-mode {
            background-color: #1a1a2e;
            background-image: linear-gradient(#232342 1px, transparent 1px), linear-gradient(90deg, #232342 1px, transparent 1px);
        }

        .preview-panel.dark-mode .theme-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border-color: #444;
        }

        /* Tab Logic Override */

        /* Tab Logic Override */
        .tab-content {
            display: none;
        }

        /* Default hidden */
        .tab-content.active {
            display: block !important;
        }

        /* JS toggles this class */

        /* Tab Button Active State */
        .prop-tab.active {
            border-bottom-color: #2563eb !important;
            color: #2563eb !important;
        }

        /* Smooth Transitions */
        #preview-box {
            transition: all 0.3s ease;
        }

        /* Modal Visibility Logic */
        #codeModal {
            display: none;
        }

        /* Default hidden, script toggles display: flex */
        .code-content {
            display: none;
        }

        .code-content.active {
            display: block !important;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden bg-gray-50 text-slate-800 font-sans">

    <!-- Header/Nav -->
    <div data-include="includes/header.html"></div>
    <div data-include="includes/navbar.html"></div>

    <main class="flex flex-1 overflow-hidden relative">

        <!-- SIDEBAR (Properties) -->
        <div class="w-80 bg-white border-r border-gray-200 flex flex-col z-10 shadow-lg">

            <!-- Sticky Header -->
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-20">
                <h3 class="font-bold text-lg text-slate-700 m-0">Properties</h3>
                <button id="open-modal"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-1.5 px-3 rounded shadow transition-colors">
                    Get Code
                </button>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-gray-200 bg-gray-50 overflow-x-auto custom-scrollbar whitespace-nowrap">
                <button
                    class="prop-tab flex-1 py-2 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-gray-100 focus:outline-none transition-colors active border-b-2 border-blue-600 text-blue-600"
                    data-target="tab-element">Element</button>
                <button
                    class="prop-tab flex-1 py-2 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-gray-100 focus:outline-none transition-colors border-b-2 border-transparent"
                    data-target="tab-layout">Layout</button>
                <button
                    class="prop-tab flex-1 py-2 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-gray-100 focus:outline-none transition-colors border-b-2 border-transparent"
                    data-target="tab-typography">Typo</button>
                <button
                    class="prop-tab flex-1 py-2 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-gray-100 focus:outline-none transition-colors border-b-2 border-transparent"
                    data-target="tab-appearance">Style</button>
                <button
                    class="prop-tab flex-1 py-2 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-gray-100 focus:outline-none transition-colors border-b-2 border-transparent"
                    data-target="tab-effects">Effects</button>
            </div>

            <!-- SCROLLABLE CONTENT -->
            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">

                <!-- TAB 1: Element -->
                <div id="tab-element" class="tab-content active">
                    <div class="mb-6">
                        <h4 class="text-xs uppercase tracking-wide text-gray-400 font-bold mb-3">Element Type</h4>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Tag Name</label>
                            <select id="elementType"
                                class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2">
                                <option value="div">Box (div)</option>
                                <option value="button">Button</option>
                                <option value="h1">Heading 1</option>
                                <option value="p">Paragraph</option>
                                <option value="img">Image</option>
                                <option value="input">Input Field</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h4 class="text-xs uppercase tracking-wide text-gray-400 font-bold mb-3">Attributes</h4>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">ID</label>
                            <input type="text" id="elementId"
                                class="property-input-attr w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded p-2"
                                placeholder="Optional ID">
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Class</label>
                            <input type="text" id="elementClass"
                                class="property-input-attr w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded p-2"
                                placeholder="Optional Class"
                                value="bg-white p-6 shadow-sm border border-gray-200 rounded text-center min-w-[100px] min-h-[50px]">
                        </div>
                    </div>

                    <div class="mb-6" id="section-content">
                        <h4 class="text-xs uppercase tracking-wide text-gray-400 font-bold mb-3">Content</h4>
                        <div class="mb-3" id="text-group">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Display Text</label>
                            <input type="text" id="innerText"
                                class="property-input-text w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded p-2"
                                placeholder="Display Text" value="Preview Object">
                        </div>
                        <div class="mb-3 hidden" id="src-group">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Image URL</label>
                            <input type="text" id="srcAttribute"
                                class="property-input-text w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded p-2"
                                value="https://picsum.photos/200">
                        </div>
                        <div class="mb-3 hidden" id="placeholder-group">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Placeholder Text</label>
                            <input type="text" id="placeholderAttribute"
                                class="property-input-text w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded p-2"
                                value="Enter text...">
                        </div>
                    </div>
                </div>

                <!-- TAB 2: Layout -->
                <div id="tab-layout" class="tab-content">
                    <div class="mb-6">
                        <h4 class="text-xs uppercase tracking-wide text-gray-400 font-bold mb-3">Display Model</h4>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Display</label>
                            <select id="display"
                                class="property-input w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2"
                                data-property="display">
                                <option value="block">Block</option>
                                <option value="inline-block">Inline Block</option>
                                <option value="flex">Flex</option>
                                <option value="grid">Grid</option>
                                <option value="none">None</option>
                            </select>
                        </div>

                        <!-- Flex Props -->
                        <div id="flex-grid-props"
                            class="hidden bg-gray-50 p-3 rounded-md border border-gray-200 mb-3 space-y-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">Flex Direction</label>
                                <select id="flexDirection"
                                    class="property-input w-full bg-white border border-gray-200 text-gray-700 text-xs rounded p-1.5"
                                    data-property="flexDirection">
                                    <option value="row">Row</option>
                                    <option value="column">Column</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">Justify Content</label>
                                <select id="justifyContent"
                                    class="property-input w-full bg-white border border-gray-200 text-gray-700 text-xs rounded p-1.5"
                                    data-property="justifyContent">
                                    <option value="flex-start">Start</option>
                                    <option value="center">Center</option>
                                    <option value="space-between">Space Between</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">Gap (px)</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" id="gap-slider" min="0" max="50" value="0" data-sync="gap"
                                        data-property="gap" data-unit="px"
                                        class="property-input flex-1 h-2 bg-white rounded-lg appearance-none cursor-pointer">
                                    <input type="number" id="gap"
                                        class="property-input synced-input w-12 bg-white border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                        data-property="gap" data-unit="px" value="0">
                                </div>
                            </div>
                        </div>

                        <!-- Dimensions -->
                        <div class="mb-3" id="width-group">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Width</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="width-slider" min="0" max="800" value="200" data-sync="width"
                                    data-property="width" data-unit="px"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="width"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="width" data-unit="px" value="200">
                            </div>
                        </div>
                        <div class="mb-3" id="height-group">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Height</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="height-slider" min="0" max="800" value="200" data-sync="height"
                                    data-property="height" data-unit="px"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="height"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="height" data-unit="px" value="200">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Padding</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="padding-slider" min="0" max="100" value="20" data-sync="padding"
                                    data-property="padding" data-unit="px"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="padding"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="padding" data-unit="px" value="20">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Margin</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="margin-slider" min="0" max="100" value="0" data-sync="margin"
                                    data-property="margin" data-unit="px"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="margin"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="margin" data-unit="px" value="0">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 3: Typography -->
                <div id="tab-typography" class="tab-content">
                    <div class="mb-6">
                        <h4 class="text-xs uppercase tracking-wide text-gray-400 font-bold mb-3">Font Settings</h4>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Font Family</label>
                            <select id="fontFamily"
                                class="property-input w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2"
                                data-property="fontFamily">
                                <option value="Arial, sans-serif">Arial</option>
                                <option value="system-ui">System UI</option>
                                <option value="'Courier New', monospace">Courier New</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Font Size</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="fontSize-slider" min="10" max="100" value="16"
                                    data-sync="fontSize" data-property="fontSize" data-unit="px"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="fontSize"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="fontSize" data-unit="px" value="16">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">Weight</label>
                                <select id="fontWeight"
                                    class="property-input w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded p-2"
                                    data-property="fontWeight">
                                    <option value="400">Normal</option>
                                    <option value="700">Bold</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">Align</label>
                                <select id="textAlign"
                                    class="property-input w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded p-2"
                                    data-property="textAlign">
                                    <option value="center">Center</option>
                                    <option value="left">Left</option>
                                    <option value="right">Right</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Line Height</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="lineHeight-slider" min="1" max="3" step="0.1" value="1.5"
                                    data-sync="lineHeight" data-property="lineHeight"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="lineHeight"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="lineHeight" step="0.1" value="1.5">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Letter Spacing (px)</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="letterSpacing-slider" min="-5" max="20" step="0.5" value="0"
                                    data-sync="letterSpacing" data-property="letterSpacing" data-unit="px"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="letterSpacing"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="letterSpacing" data-unit="px" value="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Text Color</label>
                            <div
                                class="color-picker-wrapper flex items-center gap-2 border border-gray-200 rounded p-1 bg-white">
                                <input type="color" id="textColor"
                                    class="property-input w-8 h-8 rounded border-none cursor-pointer p-0"
                                    data-property="color" value="#ffffff">
                                <span class="text-xs font-mono text-gray-500 color-code">#ffffff</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 4: Appearance -->
                <div id="tab-appearance" class="tab-content">
                    <div class="mb-6">
                        <h4 class="text-xs uppercase tracking-wide text-gray-400 font-bold mb-3">Styling</h4>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Background Color</label>
                            <div
                                class="color-picker-wrapper flex items-center gap-2 border border-gray-200 rounded p-1 bg-white">
                                <input type="color" id="bgColor"
                                    class="property-input w-8 h-8 rounded border-none cursor-pointer p-0"
                                    data-property="backgroundColor" value="#3498db">
                                <span class="text-xs font-mono text-gray-500 color-code">#3498db</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Border Radius</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="borderRadius-slider" min="0" max="100" value="0"
                                    data-sync="borderRadius" data-property="borderRadius" data-unit="px"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="borderRadius"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="borderRadius" data-unit="px" value="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Transition</label>
                            <select id="transition"
                                class="property-input w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2"
                                data-property="transition">
                                <option value="none">None</option>
                                <option value="all 0.3s ease">All 0.3s Ease</option>
                                <option value="all 0.5s linear">All 0.5s Linear</option>
                                <option value="all 1s ease-in-out">All 1s Smooth</option>
                                <option value="transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)">Bouncy Zoom
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- TAB 5: EFFECTS -->
                <div id="tab-effects" class="tab-content">

                    <!-- Interaction Builder -->
                    <div class="bg-indigo-50 p-4 rounded-lg mb-6 border border-indigo-100">
                        <h4 class="text-sm font-bold text-indigo-900 mb-3">Add Interaction</h4>

                        <div class="mb-3">
                            <label class="block text-xs font-medium text-indigo-800 mb-1">When (Trigger)</label>
                            <select id="interactionTrigger"
                                class="w-full bg-white border border-indigo-200 text-gray-700 text-sm rounded-md focus:ring-indigo-500 focus:border-indigo-500 block p-2">
                                <option value="hover">Mouse Over (Hover)</option>
                                <option value="active">Click (Active)</option>
                                <option value="always">Always (Loop)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="block text-xs font-medium text-indigo-800 mb-1">Do (Effect)</label>
                            <select id="interactionEffect"
                                class="w-full bg-white border border-indigo-200 text-gray-700 text-sm rounded-md focus:ring-indigo-500 focus:border-indigo-500 block p-2">
                                <option value="grow">Grow (Scale Up)</option>
                                <option value="shrink">Shrink (Scale Down)</option>
                                <option value="rotate">Rotate</option>
                                <option value="lift">Lift Up</option>
                                <option value="shake">Shake</option>
                                <option value="pulse">Pulse</option>
                                <option value="rainbow">Rainbow Colors</option>
                                <option value="glow">Glow Effect</option>
                            </select>
                        </div>

                        <button id="addInteractionBtn"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded shadow transition-colors text-sm">
                            + Add Effect
                        </button>
                        <div id="interactionFeedback" class="text-red-500 text-xs mt-2 min-h-[1.2em]"></div>

                        <!-- Active List -->
                        <div id="activeInteractionsList" class="mt-4 pt-3 border-t border-indigo-200">
                            <label class="block text-xs font-semibold text-indigo-900 mb-2">Active Interactions:</label>
                            <div id="interaction-list-items" class="flex flex-col gap-2">
                                <div
                                    class="text-xs text-gray-500 text-center italic p-2 bg-white border border-indigo-100 border-dashed rounded">
                                    No interactions added.</div>
                            </div>
                        </div>
                    </div>

                    <!-- Visual Styles -->
                    <div class="mb-6">
                        <h4 class="text-xs uppercase tracking-wide text-gray-400 font-bold mb-3">Visual Styles</h4>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Opacity</label>
                            <div class="flex items-center gap-2">
                                <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="1"
                                    data-sync="opacity" data-property="opacity"
                                    class="property-input flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <input type="number" id="opacity"
                                    class="property-input synced-input w-16 bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded p-1 text-center"
                                    data-property="opacity" step="0.1" value="1">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Box Shadow</label>
                            <select id="boxShadow"
                                class="property-input w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded block p-2"
                                data-property="boxShadow">
                                <option value="none">None</option>
                                <option value="0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)">
                                    Soft Shadow</option>
                                <option
                                    value="0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)">
                                    Deep Shadow</option>
                            </select>
                        </div>
                    </div>

                    <!-- Transforms (Manual/Preset) -->
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="text-xs uppercase tracking-wide text-gray-400 font-bold">Transform</h4>
                            <label class="inline-flex relative items-center cursor-pointer">
                                <input type="checkbox" id="manualTransformInfo" class="sr-only peer">
                                <div
                                    class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600">
                                </div>
                                <span class="ml-2 text-xs font-medium text-gray-600">Manual</span>
                            </label>
                        </div>

                        <div id="transform-preset-mode">
                            <div class="mb-3">
                                <select id="transform"
                                    class="property-input w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded block p-2"
                                    data-property="transform">
                                    <option value="none">None</option>
                                    <option value="rotate(45deg)">Rotate 45deg</option>
                                    <option value="scale(1.2)">Scale 1.2x</option>
                                </select>
                            </div>
                        </div>

                        <div id="transform-manual-mode"
                            class="hidden bg-gray-50 p-3 rounded border border-gray-200 border-dashed">
                            <div class="mb-3">
                                <label class="block text-xs font-medium text-gray-600 mb-1">Rotate</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" id="rotate-slider" min="0" max="360" value="0"
                                        class="manual-transform flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                    <input type="number" id="rotate-val" value="0"
                                        class="manual-transform synced-input-sm w-12 text-xs border rounded text-center p-1">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-medium text-gray-600 mb-1">Scale</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1"
                                        class="manual-transform flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                    <input type="number" id="scale-val" value="1" step="0.1"
                                        class="manual-transform synced-input-sm w-12 text-xs border rounded text-center p-1">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-medium text-gray-600 mb-1">Skew X</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" id="skewX-slider" min="-90" max="90" value="0"
                                        class="manual-transform flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                    <input type="number" id="skewX-val" value="0"
                                        class="manual-transform synced-input-sm w-12 text-xs border rounded text-center p-1">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-medium text-gray-600 mb-1">Translate X</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" id="translateX-slider" min="-100" max="100" value="0"
                                        class="manual-transform flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                    <input type="number" id="translateX-val" value="0"
                                        class="manual-transform synced-input-sm w-12 text-xs border rounded text-center p-1">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-medium text-gray-600 mb-1">Translate Y</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" id="translateY-slider" min="-100" max="100" value="0"
                                        class="manual-transform flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                    <input type="number" id="translateY-val" value="0"
                                        class="manual-transform synced-input-sm w-12 text-xs border rounded text-center p-1">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- PREVIEW AREA -->
        <div
            class="preview-panel flex-1 bg-gray-100 relative flex items-center justify-center overflow-hidden transition-colors duration-300">
            <!-- Theme Toggle -->
            <button id="theme-toggle"
                class="absolute top-4 left-4 w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow-sm border border-gray-200 flex items-center justify-center text-lg hover:scale-110 transition-transform theme-btn">
                🌙
            </button>

            <div id="preview-container" class="w-full h-full flex items-center justify-center p-10">
                <div id="preview-box"
                    class="bg-white p-6 shadow-sm border border-gray-200 rounded text-center min-w-[100px] min-h-[50px]">
                    Preview Object
                </div>
            </div>
        </div>
    </main>

    <!-- Dynamically loaded Footer -->
    <div data-include="includes/footer.html"></div>


    <!-- Modal (Tailwind-ified) -->
    <div id="codeModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div
            class="bg-[#1e1e1e] w-[800px] h-[600px] rounded-lg shadow-2xl flex flex-col text-gray-300 font-mono text-sm overflow-hidden">
            <!-- Header -->
            <div class="flex justify-between items-center px-4 py-3 bg-[#252526] border-b border-[#333]">
                <span class="font-bold text-white">Generated Code</span>
                <span class="close-modal cursor-pointer text-gray-400 hover:text-white text-xl">&times;</span>
            </div>
            <!-- Tabs -->
            <div class="flex bg-[#2d2d2d]">
                <button class="tab-btn px-6 py-2 bg-[#1e1e1e] text-white border-t-2 border-blue-500 text-xs"
                    data-tab="html">HTML</button>
                <button class="tab-btn px-6 py-2 hover:bg-[#333] text-gray-400 text-xs" data-tab="css">CSS</button>
                <button class="tab-btn px-6 py-2 hover:bg-[#333] text-gray-400 text-xs" data-tab="js">JS</button>
            </div>
            <!-- Content -->
            <div class="flex-1 p-0 overflow-auto code-area">
                <div id="code-html" class="code-content active p-4 whitespace-pre font-mono text-blue-300"></div>
                <div id="code-css" class="code-content p-4 whitespace-pre font-mono text-blue-300"></div>
                <div id="code-js" class="code-content p-4 whitespace-pre font-mono text-blue-300"></div>
            </div>
            <!-- Footer -->
            <div class="p-3 bg-[#252526] border-t border-[#333] flex justify-end">
                <button
                    class="copy-btn bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-xs font-semibold">Copy
                    Active Tab</button>
            </div>
        </div>
    </div>

    <!-- Script reused -->
    <script src="js/script-tailwind.js"></script>
</body>

</html>
