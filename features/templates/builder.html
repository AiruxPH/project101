<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Layout Builder - PROJECT 101</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="css/layouts.css">
    <link rel="stylesheet" href="css/builder.css">
    <!-- Component Loader Script -->
    <script src="../../js/loader.js" defer></script>
</head>

<body>
    <!-- Dynamically loaded Header and Navbar -->
    <div data-include="../../includes/header.html" data-root="../../"></div>
    <div data-include="../../includes/navbar.html" data-root="../../"></div>

    <div class="builder-container">
        <!-- Sidebar -->
        <aside class="builder-sidebar">
            <div class="sidebar-header">
                <h2>Component Library</h2>
            </div>
            <div class="component-library">
                <div class="library-section">
                    <h3>Navigation</h3>
                    <div class="comp-item" data-type="navbar_simple" aria-label="Add simple navbar component">
                        <div class="comp-icon"></div>
                        <span>Simple Navbar</span>
                    </div>
                </div>

                <div class="library-section">
                    <h3>Hero Sections</h3>
                    <div class="comp-item" data-type="hero_centered" aria-label="Add centered hero section">
                        <div class="comp-icon"></div>
                        <span>Centered Hero</span>
                    </div>
                    <div class="comp-item" data-type="hero_split" aria-label="Add split hero section">
                        <div class="comp-icon"></div>
                        <span>Split Hero</span>
                    </div>
                </div>

                <div class="library-section">
                    <h3>Content Blocks</h3>
                    <div class="comp-item" data-type="features_grid" aria-label="Add features grid component">
                        <div class="comp-icon"></div>
                        <span>Features Grid</span>
                    </div>
                    <div class="comp-item" data-type="content_center" aria-label="Add centered text content block">
                        <div class="comp-icon"></div>
                        <span>Centered Text</span>
                    </div>
                </div>

                <div class="library-section">
                    <h3>Footers</h3>
                    <div class="comp-item" data-type="footer_simple" aria-label="Add simple footer component">
                        <div class="comp-icon"></div>
                        <span>Simple Footer</span>
                    </div>
                </div>
            </div>

            <!-- New Sidebar Footer for primary actions -->
            <div class="sidebar-footer"
                style="padding: 1.5rem; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 0.75rem;">
                <button id="clear-canvas" class="btn btn-outline" style="width: 100%;">Clear All</button>
                <button id="export-code" class="btn btn-primary" style="width: 100%;">Export HTML/CSS</button>
            </div>
        </aside>

        <!-- Builder Interface -->
        <main class="builder-canvas-area">
            <div id="canvas-frame" class="canvas-frame">
                <div class="empty-canvas-msg">
                    <p>Select components from the left to start building your layout.</p>
                </div>
                <!-- Modular sections will be added here -->
            </div>
        </main>
    </div>

    <!-- Export Code Modal with Tabs -->
    <div id="codeModal" class="modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content"
            style="background:#fff; width:85%; max-width:1000px; padding:0; border-radius:12px; position:relative; max-height:90vh; display:flex; flex-direction:column;">
            <span class="close-modal" id="modal-close-x"
                style="position:absolute; right:20px; top:15px; cursor:pointer; font-size:1.5rem; z-index:10;">&times;</span>

            <!-- Modal Header -->
            <div style="padding:2rem 2rem 1rem 2rem; border-bottom: 1px solid #e2e8f0;">
                <h2 style="margin:0;">Your Custom Layout Code</h2>
            </div>

            <!-- Tab Navigation -->
            <div style="display:flex; gap:0.5rem; padding:0 2rem; background:#f8fafc; border-bottom:1px solid #e2e8f0;">
                <button class="code-tab active" data-tab="html"
                    style="padding:0.75rem 1.5rem; border:none; background:transparent; cursor:pointer; font-weight:600; border-bottom:2px solid transparent; transition:all 0.2s;">
                    HTML
                </button>
                <button class="code-tab" data-tab="css"
                    style="padding:0.75rem 1.5rem; border:none; background:transparent; cursor:pointer; font-weight:600; border-bottom:2px solid transparent; transition:all 0.2s;">
                    CSS
                </button>
            </div>

            <!-- Tab Content -->
            <div style="flex:1; overflow-y:auto; padding:2rem;">
                <div id="html-tab-content" class="tab-content" style="display:block;">
                    <div
                        style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:1.5rem; max-height:400px; overflow-y:auto;">
                        <pre
                            style="margin:0; white-space:pre-wrap; word-wrap:break-word;"><code id="exported-html"></code></pre>
                    </div>
                    <button id="copy-html" class="btn btn-primary" style="margin-top:1rem;">Copy HTML</button>
                </div>

                <div id="css-tab-content" class="tab-content" style="display:none;">
                    <div
                        style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:1.5rem; max-height:400px; overflow-y:auto;">
                        <pre
                            style="margin:0; white-space:pre-wrap; word-wrap:break-word;"><code id="exported-css"></code></pre>
                    </div>
                    <button id="copy-css" class="btn btn-primary" style="margin-top:1rem;">Copy CSS</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/builder.js"></script>
</body>

</html>
